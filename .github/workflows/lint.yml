name: Lint Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Volta
        uses: volta-cli/action@v5

      - name: Run lint and JavaScript tests
        run: |
          yarn
          yarn lint
          yarn test:js --runInBand

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHP checks
        run: composer check:php
