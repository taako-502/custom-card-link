compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

packageExtensions:
  "@wordpress/e2e-test-utils-playwright@*":
    peerDependenciesMeta:
      "@playwright/test":
        optional: true

# @wordpress/block-editor supports React 18, but its archived
# react-autosize-textarea dependency still declares peer support only up to
# React 16. Suppress only those known upstream metadata warnings.
logFilters:
  - pattern: "react is listed by your project with version * which doesn't satisfy what react-autosize-textarea *"
    level: discard
  - pattern: "react-dom is listed by your project with version * which doesn't satisfy what react-autosize-textarea *"
    level: discard
  - code: YN0086
    level: discard
